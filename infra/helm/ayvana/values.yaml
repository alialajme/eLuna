# Global image settings
image:
  registry: ayvanaacr.azurecr.io
  repository: e-ayvana
  tag: latest          # overridden by CI with the git SHA
  pullPolicy: IfNotPresent

# Key Vault (Secrets Store CSI) settings
keyVault:
  name: ayvana-kv
  tenantId: "00000000-0000-0000-0000-000000000000"   # set per tenant
  userAssignedIdentityClientId: ""                     # workload identity client id

serviceAccount:
  name: ayvana-workload-identity

# Secrets to mount as env (name in Key Vault == env var name)
secrets:
  - DATABASE_URL
  - ANTHROPIC_API_KEY
  - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
  - CLERK_SECRET_KEY
  - CLOUDINARY_URL

ingress:
  className: nginx
  clusterIssuer: letsencrypt-prod

# Per-app configuration
apps:
  - name: customer
    host: ayvana.ae
    replicas: 2
  - name: vendor
    host: sell.ayvana.ae
    replicas: 2
  - name: admin
    host: ops.ayvana.ae
    replicas: 2
  - name: supplier
    host: supply.ayvana.ae
    replicas: 2

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Single-executor DB migration (pre-install/pre-upgrade Helm hook Job, §44).
# Disabled by default: enable once the `migrator` image is built + pushed and the
# Job has been validated against a cluster. Uses the same image.tag as the apps.
migration:
  enabled: false
  backoffLimit: 2
  activeDeadlineSeconds: 600
  # Applies the committed Prisma migration history (baseline 0_init onward) as a
  # single pre-upgrade executor. See docs/adr/0007-database-migrations.md.
  # NOTE: an EXISTING db-push-managed database must be baselined ONCE before the
  # first deploy: `prisma migrate resolve --applied 0_init` (marks the baseline
  # applied without re-running it). A fresh database needs no such step.
  command: ["pnpm", "--filter", "@ayvana/db", "exec", "prisma", "migrate", "deploy"]

# AI Studio background worker (queue consumer for generation jobs). Disabled by
# default: enable once the `studio-worker` image is built + pushed and the
# Deployment has been validated against a cluster. Uses the same image.tag as the apps.
studioWorker:
  enabled: false
  replicas: 1
  intervalMs: 2000
