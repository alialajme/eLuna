name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field
      # (pnpm@9.0.0). Specifying it here too makes pnpm/action-setup@v4 error
      # with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client so @e-luna/db re-exports model types
      # (e.g. SizeProfile); without this, tsc sees them as missing/any.
      - name: Generate Prisma client
        run: pnpm --filter @e-luna/db db:generate

      - name: Deploy-parity guard (all apps deployed + health probes)
        run: node scripts/check-deploy-parity.mjs

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm --filter "@e-luna/*" exec tsc --noEmit

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eluna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eluna_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @e-luna/db db:generate

      - name: Push schema to test database
        run: pnpm --filter @e-luna/db exec prisma db push --skip-generate

      - name: Run tests with coverage
        run: pnpm --filter @e-luna/db test:coverage

      - name: Run package unit tests (@e-luna/auth)
        run: pnpm --filter @e-luna/auth test
