name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field
      # (pnpm@9.0.0). Specifying it here too makes pnpm/action-setup@v4 error
      # with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client so @e-luna/db re-exports model types
      # (e.g. SizeProfile); without this, tsc sees them as missing/any.
      - name: Generate Prisma client
        run: pnpm --filter @e-luna/db db:generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm --filter "@e-luna/*" exec tsc --noEmit
