name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # SAST — CodeQL for JS/TS (interpreted, no build step needed). Findings are
  # uploaded to the repo Security tab.
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # Dependency + secret vulnerability scan of the repo/lockfile. Fails the build
  # on fixable CRITICAL/HIGH; unfixable advisories are ignored so we don't block
  # on things we can't remediate. Results also uploaded as SARIF.
  trivy-deps:
    name: Trivy (deps + secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (report-only)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Report-only: surface findings in the job log without blocking CI while
          # the existing backlog is triaged. Flip exit-code back to "1" to enforce.
          exit-code: "0"
          format: table

  # IaC / container misconfiguration scan (Dockerfile, Helm, Bicep, K8s).
  trivy-config:
    name: Trivy (IaC misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan (report-only)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          # Report-only: surface findings in the job log without blocking CI while
          # the existing backlog is triaged. Flip exit-code back to "1" to enforce.
          exit-code: "0"
          format: table
