name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # SAST — CodeQL for JS/TS (interpreted, no build step needed). Findings are
  # uploaded to the repo Security tab.
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # Dependency + secret vulnerability scan of the repo/lockfile. Enforcing: fails
  # the build on fixable CRITICAL/HIGH. Unfixable advisories are skipped
  # (ignore-unfixed); individually-triaged waivers live in .trivyignore.
  trivy-deps:
    name: Trivy (deps + secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

  # IaC / container misconfiguration scan (Dockerfile, Helm, Bicep, K8s).
  # Enforcing: fails the build on CRITICAL/HIGH misconfigurations.
  trivy-config:
    name: Trivy (IaC misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          exit-code: "1"
          format: table
