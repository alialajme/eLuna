name: Azure Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to commit SHA)"
        required: false

permissions:
  id-token: write   # OIDC federation to Azure
  contents: read

env:
  ACR_NAME: ayvanaacr
  AKS_NAME: ayvana-aks
  RESOURCE_GROUP: ayvana-rg
  IMAGE_REPO: ayvana

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push images (ACR)
        run: |
          for app in customer vendor admin supplier; do
            az acr build \
              --registry "$ACR_NAME" \
              --image "$IMAGE_REPO/$app:${{ steps.tag.outputs.value }}" \
              --build-arg APP=$app \
              --file docker/Dockerfile .
          done

      - name: Build & push migrator image (ACR)
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPO/migrator:${{ steps.tag.outputs.value }}" \
            --file docker/Dockerfile.migrate .

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_NAME" --overwrite-existing

      - name: Helm deploy
        run: |
          helm upgrade --install ayvana infra/helm/ayvana \
            --namespace ayvana --create-namespace \
            --set image.tag=${{ steps.tag.outputs.value }} \
            --wait --timeout 10m
